[package]
name = "clinix"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "CLI tool to manage Nix environments (env) and a NixOS system (sys) using default nix. Clinx pins package versions with a `flake.lock` used by `shell.nix` or `flake.nix`."
readme = "README.md"
authors = [ "Derek Prijatelj <derek.s.prijatelj@gmail.com>" ]
keywords = ["nix", "NixOS", "flakes", "flake", "cli"]
categories = [ "command-line-utilities" ]
repository = "https://github.com/prijatelj/clinix"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
rayon = "1"
rnix = "0.11"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

# External binaries clinix depends upon for certain commands.
# See shell.nix and the accompaning flake.lock for the authoritative versions.
[package.metadata.external-tools]
# Required for the corresponding features (absent → that command errors clearly).
required = [
  "curl",             # OCI registry digest resolution (export docker --from)
  "git",              # ls-remote for input resolution (pin/init/update)
  "nix-instantiate",  # eval + instantiate (info/deps/export/launch)
  "nix-store",        # closure/export/import/gc-roots
  "nix-build",        # build (docker image tarball)
  "nix-shell",        # enter/run
  "nix-prefetch-url", # narHash for a pinned input
  "nix-hash",         # SRI conversion
]
# Optional: used when present, with a documented fallback or clear error.
optional = [
  "docker",           # export docker --load; authenticated --from digest fallback
  "skopeo",           # daemon-free authenticated --from digest fallback
]
